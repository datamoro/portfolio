  <text x="86" y="70" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2937">Legacy ERP</text>
  <text x="86" y="84" text-anchor="middle" font-size="9" fill="#6b7280">SQL Server</text>
  <text x="86" y="97" text-anchor="middle" font-size="9" fill="#6b7280">Oracle Protheus</text>

  <!-- Operational DW -->
  <rect x="24" y="114" width="124" height="42" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="86" y="133" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2937">Legacy DW</text>
  <text x="86" y="149" text-anchor="middle" font-size="9" fill="#6b7280">Oracle ADW</text>

  <!-- CRM -->
  <rect x="24" y="168" width="124" height="42" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="86" y="187" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2937">CRM</text>
  <text x="86" y="203" text-anchor="middle" font-size="9" fill="#6b7280">Salesforce</text>

