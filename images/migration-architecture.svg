  <text x="548" y="376" text-anchor="middle" font-size="9.5" fill="#6b21a8">Access Control  ·  Data Catalog  ·  Lineage Tracking  ·  Data Quality Monitoring  ·  Automated Tests</text>
  <text x="548" y="392" text-anchor="middle" font-size="9" fill="#9333ea">Open-source bias — Cloud-agnostic design (portable to Azure / AWS)</text>

