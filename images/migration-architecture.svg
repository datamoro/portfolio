  <rect x="24" y="222" width="124" height="52" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="86" y="241" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2937">Operational</text>
  <text x="86" y="255" text-anchor="middle" font-size="9" fill="#6b7280">CX · Finance</text>
  <text x="86" y="268" text-anchor="middle" font-size="9" fill="#6b7280">Logistics · ERP</text>

