  <text x="86" y="305" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2937">Unstructured</text>
  <text x="86" y="319" text-anchor="middle" font-size="9" fill="#6b7280">Spreadsheets</text>
  <text x="86" y="332" text-anchor="middle" font-size="9" fill="#6b7280">Images · Audio</text>

  <!-- Arrows sources → kafka -->
  <line x1="148" y1="76" x2="198" y2="180" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)" stroke-dasharray="4,3"/>
  <line x1="148" y1="135" x2="198" y2="185" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)" stroke-dasharray="4,3"/>
  <line x1="148" y1="189" x2="198" y2="190" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)" stroke-dasharray="4,3"/>
