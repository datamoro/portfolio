  <text x="901" y="137" text-anchor="middle" font-size="8.5" fill="#92400e">Dashboards</text>

  <!-- Superset -->
  <rect x="864" y="158" width="74" height="42" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="901" y="177" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Apache</text>
  <text x="901" y="191" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Superset</text>

  <!-- Prometheus / Grafana -->
  <rect x="864" y="212" width="74" height="42" rx="7" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="901" y="231" text-anchor="middle" font-size="9" font-weight="700" fill="#c2410c">Prometheus</text>
  <text x="901" y="245" text-anchor="middle" font-size="9" fill="#9a3412">Grafana</text>

  <!-- ─────────────── IMPACT bar ─────────────── -->
