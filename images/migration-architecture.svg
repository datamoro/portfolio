  <text x="480" y="448" text-anchor="middle" font-size="11" font-weight="800" fill="white" letter-spacing="2">OUTCOME</text>
  <text x="220" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#60a5fa">93%</text>
  <text x="220" y="483" text-anchor="middle" font-size="9" fill="#93c5fd">Latency Reduction</text>
  <text x="480" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#34d399">Near Real-Time</text>
  <text x="480" y="483" text-anchor="middle" font-size="9" fill="#6ee7b7">Board-level operational decisions</text>
  <text x="740" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#a78bfa">AI-Ready</text>
  <text x="740" y="483" text-anchor="middle" font-size="9" fill="#c4b5fd">Foundation for ML / LLM workloads</text>

